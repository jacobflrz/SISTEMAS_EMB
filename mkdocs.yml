site_name: SISTEMAS EMBEBIDOS

nav:
  - Inicio: index.md
  - Session 1: practica1.md
  - Session 2: practica2.md
  - Session 3: practica3.md
  - Session 4: practica4.md
  - Session 5: practica5.md
  - Session 6: practica6.md   
  - Session 7: practicax.md
  - Session 8: practica7.md
  - Session 9: practica8.md
  - Session 10: practica9.md
  - Session 11: practica10.md
  - Session 12: practica11.md
  - Session 13: practica12.md
  - Session 14: practica13.md
  - Final Project: index3.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.critic:
      mode: view
  - pymdownx.caret
  - pymdownx.keys
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.arithmatex
  - admonition
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

theme:
  name: material
  highlightjs: true 
  palette:
    - scheme: default
      primary: black
      accent: yellow

  features:
    - content.code.copy
    - content.tooltips

extra_css:
  - https://use.fontawesome.com/releases/v6.5.2/css/all.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css